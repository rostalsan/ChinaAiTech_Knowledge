# 应用分类体系（第二套知识脉络：「时间线进度 × 应用分类」视图用）
# 与 config/tree.yaml（技术主题树）相互独立：那套回答「技术原理上属于什么」，
# 这套回答「这个进展落在哪个应用领域」。同一篇文章可以挂多个应用分类。
# keywords 按 标题/摘要/全文前2000字 位置加权打分（标题4 > 摘要2 > 全文1，同分按书写序），
# 机器只取得分最高的一枚主分类标签（2026-10-09 依人工调整反向学习：用户 7 次改判全部为单标签）；
# 零命中兜底打入 fallback 指向的「日常新闻」。脚本自动打标，LLM 整理会话可复核改判。
# 领域排序仅影响同分时的归属偏好，越核心的域越靠前。
# 2026-10-08 梳理：新增 embodied 具身域；删除各域万能词（代码/论文/arXiv/实验室/科研/推理/世界模型/图像）。
# fallback: news —— 各实域全部零命中的文章兜底打入「日常新闻」：不参与关键词竞争（权重
# 天然最低、永远垫底），yaml 书写序也置末，看板列位于最底部；可经人工审阅改判升级。

fallback: news

